# نشر على npm لما تعمل tag بالشكل v0.2.0 — من غير أي توكن (Trusted Publishing):
# GitHub بيثبت هويّته لـnpm مباشرةً، والنسخة بتطلع عليها علامة «Provenance».
# النسخة بتتحجز (staged) لحد ما المالك يوافق: npmjs.com ← Staged Packages ← Approve (passkey).
# كده حتى لو الريبو اتخترق، مفيش نسخة بتنزل من غير موافقة.
# أول مرّة بس: npmjs.com ← الحزمة ← Settings ← Trusted Publisher ← GitHub Actions
#   (Organization: easy-edu · Repository: easyedu-icons · Workflow: publish.yml)
name: Publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - name: Version matches tag
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run build
      - run: npm stage publish
